<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jargon AI — Admin</title><link rel="stylesheet" href="/styles.css"><style>body{background:#0b0b0d;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.gold{color:#d8b66b}a{color:#d8b66b}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#171719;border:1px solid #4c3c25;border-radius:14px;padding:18px;margin:12px 0}.big{font-size:28px;color:#e0bf78}table{width:100%;border-collapse:collapse;display:block;overflow:auto}td,th{text-align:left;padding:11px;border-bottom:1px solid #39332a;white-space:nowrap}button,select{padding:8px;border-radius:7px;background:#d8b66b;color:#17130b;border:0} .error{color:#ff9b9b}</style></head><body><main class="wrap"><a href="/">← Jargon AI</a><h1 class="gold">Administrator dashboard</h1><p id="msg">Loading dashboard…</p><section class="stats" id="stats"></section><section class="card"><h2 class="gold">Recent payments</h2><table><thead><tr><th>Reference</th><th>Customer</th><th>Plan</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody id="payments"></tbody></table></section><section class="card"><h2 class="gold">Customers</h2><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Plan</th><th>Change plan</th></tr></thead><tbody id="users"></tbody></table></section></main><script src="/admin.js"></script></body></html>
