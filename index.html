<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jargon AI V9 Direct</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5ff;margin:0;padding:0}
.top{background:#7c3aed;color:white;padding:18px;text-align:center;font-size:22px;font-weight:bold}
.sub{text-align:center;color:#666;padding:8px;font-size:14px}
#chat{padding:12px;padding-bottom:90px;max-width:700px;margin:auto}
.msg{background:white;padding:14px;border-radius:14px;margin-bottom:12px;line-height:1.6;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.you{background:#ede9fe;font-weight:bold}
.ai b{color:#111}
button.listen{background:#7c3aed;color:white;border:none;padding:8px 16px;border-radius:20px;margin-top:10px;cursor:pointer}
.bar{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;gap:8px;padding:10px;align-items:center;border-top:1px solid #ddd}
.bar input{flex:1;padding:12px;border-radius:25px;border:1px solid #ddd;outline:none}
.bar button{padding:12px 18px;border:none;border-radius:25px;background:#7c3aed;color:white;font-weight:bold;cursor:pointer}
.ideas{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px 10px}
.ideas button{background:white;border:1px solid #ddd;padding:8px 14px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>
<div class="top">Jargon AI 🤖 V9 - DIRECT</div>
<div class="sub">Good ideas begin with a question. Ask anything - get a direct answer.</div>
<div class="ideas">
<button onclick="askIdea('Business idea in Eldoret')">✨ Business Idea</button>
<button onclick="askIdea('Study tip')">📚 Study Tip</button>
<button onclick="askIdea('What is AI?')">🤖 What is AI?</button>
</div>
<div id="chat">
<div class="msg ai"><b>Jargon AI:</b> Hi! Ask me anything. I will answer directly - no extra questions.</div>
</div>
<div class="bar">
<button onclick="startVoice()">🎤</button>
<input id="q" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
<script>
function askIdea(t){document.getElementById('q').value=t;send();}
function addMsg(text,cls){let d=document.createElement('div');d.className='msg '+cls;d.innerHTML=text;document.getElementById('chat').appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d;}
function speak(t){let u=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,''));speechSynthesis.speak(u);}
function startVoice(){let r=new (window.SpeechRecognition||window.webkitSpeechRecognition)();r.lang='en-KE';r.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript;send();};r.start();}
async function send(){
let q=document.getElementById('q').value.trim();if(!q)return;
addMsg('You: '+q,'you');document.getElementById('q').value='';
let box=addMsg('<b>Jargon AI:</b> Thinking...','ai');
let answer='';
try{
let res=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q));
let data=await res.json();
if(data.extract){answer=data.extract.split('. ').slice(0,3).join('. ')+'.';}
else{answer='Here is a direct answer: '+q+' is an important topic. In simple terms, it means what you asked about in daily life in Kenya and around the world.';}
}catch(e){answer='Here is a direct answer: '+q+' - In simple terms, this is something you see and use in daily life. For example in Eldoret, people use it at school, at home, and in business.';}
let html='<b>Jargon AI:</b> '+answer+'<br><button class="listen" onclick="speak(`'+answer.replace(/'/g,"")+'`)">🔊 Listen</button>';
box.innerHTML=html;
}
</script>
</body>
</html>
