<!DOCTYPE html>
<html>

<meta name="viewport" content="width=device-width, initial-scale=1">

<body>

<div style="background:#10b981;padding:8px;text-align:center;color:white;font-weight:bold">✅ NO KEY NEEDED | <span id="limit">Daily: 50 / 50 left</span></div>

<button onclick="startVoice()">🎤 Voice</button>

<div id="tools">

<button class="small" onclick="document.getElementById('photo').click()">🖼️ Upload Photo</button>
<button class="small" onclick="document.getElementById('cam').click()">📷 Camera</button>
<button class="small" onclick="makePDF()">📄 Make PDF</button>
<button class="small" onclick="speak(lastAnswer)">🔊 Read Aloud</button>
<button class="small" onclick="copyCode()">📋 Copy</button>
</div>
<input type="file" id="file" hidden onchange="handleFile(this)">
<input type="file" id="photo" accept="image/*" hidden onchange="handleFile(this)">
<input type="file" id="cam" accept="image/*" capture="camera" hidden onchange="handleFile(this)">
<div id="preview"></div>
</div>
