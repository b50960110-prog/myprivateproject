<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jargon AI V16 - WORKING</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>Jargon AI 🤖 V16 - WORKING</header>
<div id="topbar">✅ NO KEY NEEDED | <span id="limit">Daily: 50 / 50 left</span></div>
<div id="messages"><div class="ai-msg"><b>Jargon AI:</b> Hello from Eldoret! 🇰🇪 Type, Speak, Upload Photo, Camera, PDF - All Working!</div></div>

<form id="chatForm">
<input id="messageInput" placeholder="Ask anything..." autocomplete="off">
<button type="submit" id="sendBtn">Send ➤</button>
<button type="button" id="voiceBtn">🎤 Voice</button>
</form>

<div id="toolbar">
<button type="button" id="fileBtn">📎 File</button>
<button type="button" id="photoBtn">🖼️ Photo</button>
<button type="button" id="camBtn">📷 Camera</button>
<button type="button" id="pdfBtn">📄 Make PDF</button>
<button type="button" id="readBtn">🔊 Read</button>
<button type="button" id="copyBtn">📋 Copy</button>
</div>
<div id="status">Ready ✅</div>
<div id="preview"></div>

<input type="file" id="fileInput" hidden>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="camInput" accept="image/*" capture="camera" hidden>

<script src="script.js"></script>
</body>
</html>
